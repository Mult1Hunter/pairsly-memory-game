name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint every PHP file
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "all files parse on PHP ${{ matrix.php }}"

  phpcs:
    name: WordPress coding standards + PHP compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS
        run: composer phpcs -- --report=full --report-checkstyle=phpcs.xml
      - name: Annotate
        if: failure()
        uses: staabm/annotate-pull-request-from-checkstyle-action@v1
        with:
          files: phpcs.xml
          notices-as-warnings: true

  phpunit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: composer test

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: node --check on every script
        run: |
          set -e
          for f in $(git ls-files '*.js'); do node --check "$f"; done

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the distributable (what wp.org would receive)
        run: |
          mkdir -p /tmp/dist/pairsly-memory-game
          rsync -a --exclude-from=.distignore ./ /tmp/dist/pairsly-memory-game/
          find /tmp/dist -maxdepth 2 | sort
      - name: Run plugin-check on the distributable
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: /tmp/dist/pairsly-memory-game
          # Categories with actionable results for a directory submission.
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility

  i18n:
    name: Translation template is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: wp-cli
      - name: Regenerate POT and compare
        run: |
          wp i18n make-pot . languages/pairsly-memory-game.pot --exclude=vendor,node_modules,.github,bin,tests --headers='{"Report-Msgid-Bugs-To":"https://github.com/Mult1Hunter/pairsly-memory-game/issues"}' --skip-audit
          # Ignore the creation-date header; fail only on real string changes.
          # Ignore the creation date, the version header and line references; fail only on real string changes.
          if ! git diff --ignore-matching-lines='POT-Creation-Date' --ignore-matching-lines='Project-Id-Version' --ignore-matching-lines='^#: ' --exit-code languages/pairsly-memory-game.pot; then
            echo "::error::languages/pairsly-memory-game.pot is out of date - run: wp i18n make-pot . languages/pairsly-memory-game.pot"
            exit 1
          fi
